name: Metrics
 
on:
  schedule:
    - cron: "0 0 * * *"   # diario a medianoche UTC
  workflow_dispatch:
 
# Permisos mínimos del GITHUB_TOKEN automatico:
# solo puede escribir en ESTE repo (para guardar el SVG)
permissions:
  contents: write
 
jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: lowlighter/metrics@v3.34   # version fija (no @latest)
        with:
          # Token de SOLO LECTURA para leer tus repos privados
          token: ${{ secrets.METRICS_TOKEN }}
          # Token automatico de Actions para commitear el SVG en este repo
          committer_token: ${{ github.token }}
          user: lianjesu
          template: classic
          base: header, activity, community
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_indepth: no
          filename: github-metrics.svg
